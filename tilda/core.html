<script>

if (localStorage.getItem('theme') === 'light') {
    document.documentElement.classList.add('light-theme');
    document.addEventListener("DOMContentLoaded", function() {
        document.body.classList.add('light-theme');

<style>
/* 1. БЛОКИРУЕМ ПОЛЗУНОК СКРОЛЛА НА ВРЕМЯ РАБОТЫ ЛОАДЕРА */
/* Этот класс мгновенно прячет вертикальный курсор сбоку и запрещает любые движения */
html.uma-scroll-locked, 
body.uma-scroll-locked {
    overflow: hidden !important;
    height: 100vh !important;
    touch-action: none !important; /* Защита от тач-скролла на мобильных */
}

/* Настраиваем ультра-плавное возвращение ползунка скролла после лоадера */
html, body {
    transition: background-color 0.6s cubic-bezier(0.25, 1, 0.2, 1);
}
</style>

<script>
/* Каждое открытие и обновление страницы — с самого верха, под прелоадером.
   • память прокрутки браузера выключена;
   • якорь в адресе (#about и т. п.) убирается, иначе браузер и Тильда после загрузки
     прыгают к нему — отсюда «то вверху, то в середине»;
   • пока идёт прелоадер, страница держится на нуле; замок снимается, когда прелоадер ушёл
     (или через 6 с на всякий случай);
   • после снятия замка страница больше не дёргается наверх, даже если загрузка
     картинок закончилась позже — человек уже мог начать прокрутку. */
(function () {
  var root = document.documentElement;
  root.classList.add('uma-scroll-locked');
  if (document.body) document.body.classList.add('uma-scroll-locked');
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
  if (location.hash && !/^#!/.test(location.hash)) {
    try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) {}
  }
  window.scrollTo(0, 0);

  var locked = true;
  (function hold() {
    if (!locked) return;
    if (window.scrollY !== 0) window.scrollTo(0, 0);
    requestAnimationFrame(hold);
  })();
  // человек сам начал листать — больше не возвращаем наверх
  var touched = false;
  ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (t) {
    window.addEventListener(t, function () { touched = true; }, { passive: true, capture: true });
  });
  function unlock() {
    if (!locked) return;
    locked = false;
    root.classList.remove('uma-scroll-locked');
    if (document.body) document.body.classList.remove('uma-scroll-locked');
    window.scrollTo(0, 0);
    // ещё 1.5 с после снятия замка держим верх, пока человек не тронул страницу:
    // поздняя догрузка картинок, раскладка блоков и восстановление прокрутки браузером
    // иногда сдвигали страницу вниз — отсюда «то вверху, то нет» после обновления
    var until = Date.now() + 1500;
    (function keep() {
      if (touched || Date.now() > until) return;
      if (window.scrollY !== 0) window.scrollTo(0, 0);
      requestAnimationFrame(keep);
    })();
  }
  window.umaUnlockScroll = unlock;
  // прелоадер ушёл (класс completed) — снимаем замок
  function watch() {
    var pre = document.getElementById('custom-preloader');
    if (!pre) return setTimeout(unlock, 2500);
    if (pre.classList.contains('completed')) return unlock();
    new MutationObserver(function () { if (pre.classList.contains('completed')) unlock(); })
      .observe(pre, { attributes: true, attributeFilter: ['class'] });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch); else watch();
  setTimeout(unlock, 6000);
  // страница вернулась из кэша вкладок (назад/вперёд) — тоже наверх
  window.addEventListener('pageshow', function (e) { if (e.persisted) window.scrollTo(0, 0); });
  window.addEventListener('load', function () { if (!touched && !locked) window.scrollTo(0, 0); });
})();
</script>

<style>
/* ========================================================================= */
/* 1. ПРЕЛОАДЕР: ГЛОБАЛЬНАЯ СИСТЕМА ИНВЕРСИИ ЦВЕТОВ */

    --uma-accent: #d94f30;         /* акцентный оранжевый: след курсора */
    --preloader-bg: #111211;       /* Базовый тёмный графит */
    --preloader-text-bg: #202120;  /* Бледные буквы на старте */
    --uma-logo-ink: #fbfbfb;       /* цвет логотипа: цвет текста темы */
}

html.light-theme,
body.light-theme {
    --preloader-bg: #F5F4F0;       /* Матовая костяная бумага (мягкий беж) */
    --preloader-text-bg: #E3E2DE;  /* Мягкая подложка букв в светлой теме */

}

/* Главный экран прелоадера */
#custom-preloader {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background-color: var(--preloader-bg) !important;

    transition: background-color 1.2s cubic-bezier(0.19, 1, 0.22, 1), visibility 1.2s;
}

#custom-preloader.completed {
    background-color: rgba(17, 18, 17, 0) !important;
    pointer-events: none; 
}

/* АДАПТИВНЫЙ КОНТЕЙНЕР ДЛЯ ПОЛЕТА ЛОГОТИПА */
.preloader-logo-container {
    position: absolute;
    height: auto;
    z-index: 10;
    transform-origin: left center; 
    left: 50vw;
    top: 50vh;
    transform: translate3d(-50%, -50%, 0) scale(1);
    
    /* Вылет: 1.4 секунды на кубической экспоненте Безье */
    transition: transform 1.4s cubic-bezier(0.19, 1, 0.22, 1), 
                left 1.4s cubic-bezier(0.19, 1, 0.22, 1), 
                top 1.4s cubic-bezier(0.19, 1, 0.22, 1),
                width 1.4s cubic-bezier(0.19, 1, 0.22, 1);
    will-change: transform, left, top, width;
}
/* после вылета логотип «пристыкован» к шапке: без плавных переходов,
   иначе любой пересчёт положения (например, при прокрутке на телефоне) он догоняет с запаздыванием */
.preloader-logo-container.is-docked { transition: none !important; will-change: auto; }

.preloader-logo-container svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
}

/* Логотип WORKING TITLE: контраст начертаний одного шрифта —
   WORKING плотнее (700), TITLE тоньше (300). Шрифт — Manrope, как на всём сайте. */
.logo-bg-text,
.logo-fill-text {
    font-family: 'Manrope', Arial, sans-serif;
    font-size: 112px;
    letter-spacing: -3.4px;
}
.logo-w1 { font-weight: 700; }
.logo-w2 { font-weight: 300; }

/* 1 СЛОЙ: Бледные буквы на старте (в потоке, задаёт размер контейнера) */
.logo-bg-text {
    fill: var(--preloader-text-bg) !important;
    opacity: 0;
    animation: fadeInLogo 0.6s ease forwards 0.2s;
}

/* 2 СЛОЙ: заливка цветом текста темы */
.logo-fill-text {
    fill: var(--uma-logo-ink) !important;
}

/* пока шрифт логотипа не загружен и рамка не подогнана — логотип скрыт и анимации стоят,
   чтобы буквы не перескакивали из запасного шрифта */
.uma-reveal-wrap:not(.is-ready) { visibility: hidden; }
.uma-reveal-wrap:not(.is-ready),
.uma-reveal-wrap:not(.is-ready) * { animation-play-state: paused !important; }

/* Заливка логотипа с мягким краем без маски в анимации.
   Окошко (.uma-reveal) едет вправо, слой заливки внутри (.uma-reveal-inner) едет влево
   на то же расстояние. Мягкий край это статическая маска на окошке.
   --f: ширина мягкого края в долях ширины логотипа (меньше = уже и чётче). */
.uma-reveal-wrap {
    --f: 0.10;
    --s: calc(100% / (1 + var(--f)));
}

.uma-reveal {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: calc((1 + var(--f)) * 100%);
    overflow: hidden;
    transform: translate3d(-100%, 0, 0);
    will-change: transform;
    -webkit-mask-image: linear-gradient(90deg,
        #000 0, #000 var(--s),
        rgba(0,0,0,.84) calc(var(--s) + (100% - var(--s)) * .25),
        rgba(0,0,0,.5)  calc(var(--s) + (100% - var(--s)) * .5),
        rgba(0,0,0,.16) calc(var(--s) + (100% - var(--s)) * .75),
        transparent 100%);
    mask-image: linear-gradient(90deg,
        #000 0, #000 var(--s),
        rgba(0,0,0,.84) calc(var(--s) + (100% - var(--s)) * .25),
        rgba(0,0,0,.5)  calc(var(--s) + (100% - var(--s)) * .5),
        rgba(0,0,0,.16) calc(var(--s) + (100% - var(--s)) * .75),
        transparent 100%);
    animation: umaRevealOuter 1.8s cubic-bezier(0.25, 1, 0.4, 1) both 1.0s;
}

.uma-reveal-inner {
    position: absolute;
    top: 0; left: 0;
    width: calc(100% / (1 + var(--f)));
    height: 100%;
    transform: translate3d(calc((1 + var(--f)) * 100%), 0, 0);
    will-change: transform;
    animation: umaRevealInner 1.8s cubic-bezier(0.25, 1, 0.4, 1) both 1.0s;
}

@keyframes fadeInLogo { to { opacity: 1; } }

@keyframes umaRevealOuter {
    from { transform: translate3d(-100%, 0, 0); }
    to   { transform: translate3d(0, 0, 0); }
}
@keyframes umaRevealInner {
    from { transform: translate3d(calc((1 + var(--f)) * 100%), 0, 0); }
    to   { transform: translate3d(0, 0, 0); }
}

/* 💻 Финал для десктопа (хедер 48px с autoscale) */
@media screen and (min-width: 768px) {

}

/* 📱 Финал для мобильных (линия 16px на 28px) */
@media screen and (max-width: 767px) {

        left: 50vw !important;
        top: 45vh !important; 
        transform: translate3d(-50%, -50%, 0) scale(1);
    }
    /* в шапке: кегль пунктов меню, по их линии (--pl-mw, --pl-my ставит скрипт ниже) */
    #custom-preloader.completed .preloader-logo-container {
        width: var(--pl-mw, calc(41px * var(--pl-k, 1))) !important;       
        left: var(--pl-mx, 16px) !important;
        top: var(--pl-my, 30px) !important;
        transform: translate3d(0, -50%, 0) scale(1) !important;

    /* двухстрочный логотип: по центру шапки по вертикали */
    #custom-preloader.completed .preloader-logo-container.is-stacked {

    }
}

/* Цвета и стиль заливки текста лежат в блоке стилей темы (раздел «ЗАЛИВКА ТЕКСТА ОДНИМ СЛОЕМ») */

<script>
/* Логотип в прелоадере (он же логотип в шапке после вылета).
   1. Ждём шрифт логотипа (не дольше 1.5 с), чтобы буквы не перескакивали.
   2. Компьютер: одна строка WORKING TITLE. Ширина рамки SVG подгоняется под текст,
      --pl-k держит высоту букв в шапке такой же, как у прежнего логотипа (255 × 100).
   3. Телефон: две строки — WORKING над TITLE, чтобы логотип поместился в шапку
      до первого пункта меню; ширина в шапке — --pl-mw.
   Сменить название: WORDS ниже и текст в двух <text> в разметке. */
(function () {
  var wrap = document.getElementById('uma-logo-wrap');
  if (!wrap) return;
  var WORDS = ['WORKING', 'TITLE'];
  var GAP = 14;        // px: отступ логотипа от первого пункта меню на телефоне
  var MOB_H = 30;      // px: высота двухстрочного логотипа в шапке на телефоне
  var SCALE = 0.9;     // кегль логотипа относительно кегля пунктов меню
  var BASE_Y = 0.9;    // базовая линия текста в рамке логотипа (y = 90 из 100)
  var mode = '';

  function layout(stacked) {
    wrap.querySelectorAll('.uma-logo-svg text').forEach(function (t) {
      if (stacked) {
        t.setAttribute('x', '6'); t.removeAttribute('y');
        t.setAttribute('text-anchor', 'start'); t.removeAttribute('dominant-baseline');
        t.innerHTML = '<tspan class="logo-w1" x="6" y="86">' + WORDS[0] + '</tspan>' +
                      '<tspan class="logo-w2" x="6" y="184">' + WORDS[1] + '</tspan>';
      } else {
        // постоянная точка отсчёта (x = 0) и явная базовая линия: Safari по-своему понимает
        // dominant-baseline и проценты при смене viewBox — от этого заливка съезжала и резалась
        t.setAttribute('x', '0'); t.setAttribute('y', '90');
        t.removeAttribute('text-anchor'); t.removeAttribute('dominant-baseline');
        t.innerHTML = '<tspan class="logo-w1">' + WORDS[0] + '</tspan><tspan class="logo-w2" dx="26">' + WORDS[1] + '</tspan>';
      }
    });
  }

  // первый пункта меню в шапке: левый край и середина по высоте
  function navBox() {
    var nav = document.querySelectorAll('#rec3979597301 .t396__elem[data-elem-type="button"]');
    var box = null;
    for (var i = 0; i < nav.length; i++) {
      var r = nav[i].getBoundingClientRect();
      if (r.width && r.left > 40 && (!box || r.left < box.left)) box = { left: r.left, top: r.top, width: r.width, height: r.height, el: nav[i] };
    }
    return box;
  }

  function fit() {
    // логотип всегда в одну строку (на телефоне тоже)
    var stacked = false;
    if (mode !== (stacked ? 's' : 'l')) { mode = stacked ? 's' : 'l'; layout(stacked); wrap.classList.toggle('is-stacked', stacked); }
    var t = wrap.querySelector('.logo-bg-text');
    // рамка по фактическим границам текста (getBBox), с запасом PAD по бокам:
    // у W и других букв ширина «чернил» больше расчётной длины строки, иначе края обрезаются
    var PAD = 10, bb = null, h = stacked ? 200 : 100, w = 0, x0 = 0;
    try { bb = t.getBBox(); } catch (e) {}
    if (!bb || !bb.width) return;
    x0 = Math.floor(bb.x - PAD);
    w = Math.ceil(bb.width + PAD * 2);
    wrap.querySelectorAll('.uma-logo-svg').forEach(function (s) { s.setAttribute('viewBox', x0 + ' 0 ' + w + ' ' + h); });
    wrap.style.setProperty('--pl-k', (w / 255).toFixed(4));
    // кегль пунктов меню в шапке на экране и их базовая линия
    var nd = navBox(), fpx = 0, base = 0, zoom = 1;
    if (nd && nd.el) {
      var a = nd.el.querySelector('.tn-atom') || nd.el;
      var z = nd.width / (nd.el.offsetWidth || nd.width);              // zoom Тильды
      zoom = z || 1;
      fpx = parseFloat(getComputedStyle(a).fontSize) * (z || 1);
      base = baseline(a);
    }
    // логотип набран капсом и плотнее — оптически он крупнее строчных пунктов меню,
    // поэтому его кегль чуть меньше (SCALE) и он стоит на одной базовой линии с меню
    var target = fpx ? fpx * SCALE * w / 112 : 0;                        // ширина логотипа в шапке
    var hvis = target * 100 / w;                                         // высота рамки логотипа в шапке
    var y = base ? base - (BASE_Y - 0.5) * hvis : (nd ? nd.top + nd.height / 2 : 0);
    if (window.innerWidth < 768) {
      wrap.style.removeProperty('--pl-ds'); wrap.style.removeProperty('--pl-dy');
      if (target && nd) {
        var mw = Math.min(target, nd.left - 16 * zoom - GAP);            // не наезжать на меню
        hvis = mw * 100 / w;
        y = base ? base - (BASE_Y - 0.5) * hvis : y;
        wrap.style.setProperty('--pl-mw', Math.max(40, mw).toFixed(1) + 'px');
        wrap.style.setProperty('--pl-my', y.toFixed(1) + 'px');
        // левый край букв — по полю сетки Тильды (16 px макета × zoom), минус запас рамки
        wrap.style.setProperty('--pl-mx', (16 * (zoom || 1) - PAD * mw / w).toFixed(1) + 'px');
      }
    } else {
      wrap.style.removeProperty('--pl-mw'); wrap.style.removeProperty('--pl-my');
      if (target && nd) {
        var cw = Math.max(1, window.innerWidth - 64);                    // ширина логотипа до вылета
        wrap.style.setProperty('--pl-ds', (target / cw).toFixed(5));
        wrap.style.setProperty('--pl-dy', y.toFixed(1) + 'px');
      }
    }
  }

  // базовая линия текста элемента: невидимая метка нулевой высоты на базовой линии
  function baseline(el) {
    var probe = document.createElement('span');
    probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline;';
    var host = el.querySelector('a, span') || el;
    host.appendChild(probe);
    var y = probe.getBoundingClientRect().top;
    host.removeChild(probe);
    return y;
  }

  var shown = false;
  function ready() {
    if (shown) return;
    shown = true;
    fit();
    wrap.classList.add('is-ready');
  }
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('700 112px Manrope', WORDS[0]),
      document.fonts.load('300 112px Manrope', WORDS[1])
    ]).then(ready, ready);
  } else ready();
  setTimeout(ready, 1500);
  window.addEventListener('load', fit);
  // перед вылетом в шапку меряем ещё раз: к этому моменту меню уже на своих местах
  var pre = document.getElementById('custom-preloader');
  if (pre && window.MutationObserver) {
    var docked = false;
    new MutationObserver(function () {
      if (!pre.classList.contains('completed') || docked) return;
      docked = true;
      fit();
      setTimeout(function () { wrap.classList.add('is-docked'); }, 1500);   // вылет 1.4 с
    }).observe(pre, { attributes: true, attributeFilter: ['class'] });
  }
  // пересчёт только при смене ширины: на телефоне высота окна меняется при каждой прокрутке
  // (панель адреса), и логотип из-за этого «дышал»
  var tm = 0, lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(tm); tm = setTimeout(fit, 200);
  });
})();
</script>

<script>
/* Страховка: если код из GitHub так и не загрузился, прелоадер всё равно уходит.
   20 с, а не меньше: при медленной сети (например, вкладка открылась сразу после
   включения компьютера, пока не подключился Wi-Fi) лучше подождать на прелоадере,
   чем показать страницу без кода — «разобранную». Обычно код приходит из сохранённой
   копии в браузере (см. загрузчик ниже) за доли секунды. */
window.umaReleasePreloader = function () {
  var p = document.getElementById('custom-preloader');
  if (p && !p.classList.contains('completed')) p.classList.add('completed');
  document.documentElement.classList.remove('uma-scroll-locked');
  if (document.body) document.body.classList.remove('uma-scroll-locked');
};
setTimeout(window.umaReleasePreloader, 20000);
</script>

<script>
/* =========================================================================
   UMA LOADER: подтягивает весь остальной код сайта из GitHub
   Репозиторий: github.com/UlyanaNechipor/uma_studio (ветка main)
   Список файлов и порядок их подключения: uma.json в корне репозитория.
   Поле "v" в uma.json меняется при каждом изменении кода.

   ?umaref=dev     предпросмотр ветки dev (запоминается до закрытия вкладки)
   ?umaref=main    вернуться к основной версии
   ?umadebug       подробный лог загрузки в консоли
   ========================================================================= */
(function () {
  var REPO = 'UlyanaNechipor/uma_studio';
  // Источники по порядку. raw.githubusercontent: свежая версия не позже чем через 5 минут после пуша.
  // jsDelivr (три адреса) — запасной вариант: он кэширует ветку дольше, до 12 часов.
  function sources(ref) {
    return [
      'https://raw.githubusercontent.com/' + REPO + '/' + ref + '/',
      'https://cdn.jsdelivr.net/gh/' + REPO + '@' + ref + '/',
      'https://fastly.jsdelivr.net/gh/' + REPO + '@' + ref + '/',
      'https://gcore.jsdelivr.net/gh/' + REPO + '@' + ref + '/'
    ];
  }

  var q = location.search;
  var DEBUG = /[?&]umadebug/.test(q);
  function log() { if (DEBUG) console.log.apply(console, ['UMA loader:'].concat([].slice.call(arguments))); }

  /* ---------- какая ветка ---------- */
  var ref = 'main';
  try {
    var m = q.match(/[?&]umaref=([\w.\-]+)/);
    if (m) {
      ref = m[1];
      if (ref === 'main') sessionStorage.removeItem('uma_ref'); else sessionStorage.setItem('uma_ref', ref);
    } else {
      ref = sessionStorage.getItem('uma_ref') || 'main';
    }
  } catch (e) {}

  /* ---------- DOMContentLoaded / load для кода, пришедшего позже ----------
     Файлы из GitHub выполняются, когда страница уже разобрана. Обработчик
     DOMContentLoaded (или load), повешенный после этого события, вызывается сразу. */
  (function () {
    function call(fn, target, type) {
      var ev; try { ev = new Event(type); } catch (e) { ev = { type: type }; }
      if (typeof fn === 'function') fn.call(target, ev); else fn.handleEvent(ev);
    }
    function wrap(target) {
      var orig = target.addEventListener;
      target.addEventListener = function (type, fn, opts) {
        if (fn && (typeof fn === 'function' || fn.handleEvent)) {
          if (type === 'DOMContentLoaded' && document.readyState !== 'loading') {
            setTimeout(function () { call(fn, target, type); }, 0); return;
          }
          if (type === 'load' && target === window && document.readyState === 'complete') {
            setTimeout(function () { call(fn, target, type); }, 0); return;
          }
        }
        return orig.call(this, type, fn, opts);
      };
    }
    wrap(document); wrap(window);
  })();

  /* ---------- утилиты ---------- */
  function timeout(p, ms) {
    return new Promise(function (ok, fail) {
      var t = setTimeout(function () { fail(new Error('timeout')); }, ms);
      p.then(function (v) { clearTimeout(t); ok(v); }, function (e) { clearTimeout(t); fail(e); });
    });
  }
  function getText(url) {
    return timeout(fetch(url), 6000).then(function (r) {
      if (!r.ok) throw new Error(r.status + ' ' + url);
      return r.text();
    });
  }

  /* ---------- 1. список файлов (uma.json): со всех источников сразу ----------
     Свежие источники: raw.githubusercontent и GitHub API (номер последнего коммита →
     uma.json этого коммита с jsDelivr). Из России raw часто отвечает десятки секунд,
     а jsDelivr по имени ветки (@main) может часами отдавать старую версию — поэтому
     спрашиваем всех сразу, берём первый свежий ответ, а jsDelivr @main — только если
     свежие за STALE_WAIT так и не ответили. */
  var STALE_WAIT = 3500;   // мс
  function vnum(v) {       // "2026-11-08.23" → сравнимое число
    var m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})\.(\d+)$/);
    return m ? (+m[1] * 10000 + +m[2] * 100 + +m[3]) * 1000 + +m[4] : 0;
  }
  function getJSON(url, opt) {
    return timeout(fetch(url, opt || { cache: 'no-store' }), 8000).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }
  function loadManifest() {
    var t = Date.now();
    var raw = 'https://raw.githubusercontent.com/' + REPO + '/' + ref + '/';
    var stale = sources(ref).slice(1);                     // jsDelivr @ветка
    return new Promise(function (ok, fail) {
      var settled = false, freshLeft = 2, staleBest = null, staleLeft = stale.length;
      function done(x) { if (settled) return; settled = true; ok(x); }
      function maybeStale() {
        if (settled) return;
        if (staleBest && (freshLeft === 0 || Date.now() - t >= STALE_WAIT)) done(staleBest);
        else if (!staleBest && freshLeft === 0 && staleLeft === 0) { settled = true; fail(new Error('uma.json недоступен во всех источниках')); }
      }
      function freshFail(e) { log('свежий источник не ответил', e && e.message); freshLeft--; maybeStale(); }
      // raw
      getJSON(raw + 'uma.json?t=' + t).then(function (m) { log('uma.json raw', m.v); done({ base: raw, manifest: m }); }, freshFail);
      // GitHub API → sha → jsDelivr @sha
      getJSON('https://api.github.com/repos/' + REPO + '/commits/' + ref, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } })
        .then(function (c) {
          var sha = c && c.sha;
          if (!sha) throw new Error('нет sha');
          var b = 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/';
          return getJSON(b + 'uma.json').then(function (m) {
            if (!m.sha) m.sha = sha;
            log('uma.json api', m.v, sha.slice(0, 8));
            done({ base: b, manifest: m });
          });
        }).catch(freshFail);
      // jsDelivr @ветка — запасной
      stale.forEach(function (base) {
        getJSON(base + 'uma.json?t=' + t).then(function (m) {
          log('uma.json (может быть старым)', base, m.v);
          if (!staleBest || vnum(m.v) > vnum(staleBest.manifest.v)) staleBest = { base: base, manifest: m };
        }, function () {}).then(function () { staleLeft--; maybeStale(); });
      });
      setTimeout(maybeStale, STALE_WAIT);
    });
  }

  // один файл. Если в uma.json есть sha (коммит кода) — с jsDelivr по этому коммиту:
  // такой адрес неизменен, CDN никогда не отдаст по нему другую версию, и он быстрый.
  // Иначе — как раньше: тот же источник, что и uma.json, потом остальные, с ?v=.
  function loadFile(base, version, path, sha) {
    var list = sha ? [
      'https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/',
      'https://fastly.jsdelivr.net/gh/' + REPO + '@' + sha + '/',
      'https://raw.githubusercontent.com/' + REPO + '/' + sha + '/',
      'https://gcore.jsdelivr.net/gh/' + REPO + '@' + sha + '/'
    ] : [base].concat(sources(ref).filter(function (b) { return b !== base; }));
    var i = 0;
    return new Promise(function (ok, fail) {
      (function next() {
        if (i >= list.length) return fail(new Error('не загрузился ' + path));
        getText(list[i++] + path + (sha ? '' : '?v=' + encodeURIComponent(version))).then(ok, next);
      })();
    });
  }

  /* ---------- 2. сохранённая копия кода в браузере ----------
     После каждой удачной загрузки весь код (версия + тексты файлов) сохраняется
     в localStorage. При следующем открытии он берётся оттуда сразу — сайт не ждёт
     GitHub и не разваливается, если сети ещё нет (вкладка открылась после
     перезагрузки компьютера, плохой мобильный интернет). Если в GitHub новая
     версия — она скачивается и подключается вместо сохранённой. */
  var CACHE_KEY = 'uma_code_' + ref;
  var FAST = 3000;   // мс: сколько ждём свежий uma.json, прежде чем взять сохранённую копию (прелоадер всё равно идёт ~3 с)
  function readCache() {
    try { var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); return c && c.v && c.css && c.js ? c : null; }
    catch (e) { return null; }
  }
  function writeCache(c) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); }
    catch (e) { try { localStorage.removeItem(CACHE_KEY); } catch (e2) {} }
  }

  /* ---------- 3. подключение: все файлы качаются параллельно,
                    выполняются строго по порядку из uma.json ---------- */
  function download(version, base, manifest) {
    var css = manifest.css || [], js = manifest.js || [];
    var all = css.concat(js);
    return Promise.all(all.map(function (p) {
      return loadFile(base, version, p, manifest.sha).catch(function (e) { console.warn('UMA loader: ' + e.message); return null; });
    })).then(function (texts) {
      var c = {
        v: version, base: base,
        css: css.map(function (p, k) { return [p, texts[k]]; }),
        js: js.map(function (p, k) { return [p, texts[css.length + k]]; })
      };
      // в копию — только полный набор, без пропавших файлов
      if (texts.every(function (t) { return t != null; })) writeCache(c);
      return c;
    });
  }

  var applied = false;
  function inject(c, from) {
    if (applied) return;
    applied = true;
    var run = function () {
      var head = document.head || document.documentElement;
      c.css.forEach(function (f) {
        if (f[1] == null) return;
        var s = document.createElement('style');
        s.setAttribute('data-uma', f[0]);
        s.textContent = f[1];
        head.appendChild(s);
      });
      c.js.forEach(function (f) {
        if (f[1] == null) return;
        var s = document.createElement('script');
        s.setAttribute('data-uma', f[0]);
        // sourceURL: в DevTools ошибки показываются с именем файла из репозитория
        s.text = f[1] + '\n//# sourceURL=uma/' + f[0];
        head.appendChild(s);
      });
      var all = c.css.concat(c.js).map(function (f) { return f[0]; });
      window.UMA = { ref: ref, version: c.v, base: c.base, from: from, files: all };
      document.documentElement.classList.add('uma-loaded');
      log('готово', ref, 'v' + c.v, from, all.length + ' файлов');
    };
    // код рассчитан на разобранную страницу (как при загрузке из сети)
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
    else run();
  }

  function failsafe(e) {
    console.warn('UMA loader: ' + (e && e.message));
    if (window.umaReleasePreloader) window.umaReleasePreloader();
  }

  function start() {
    var cached = readCache();
    var waitT = 0;
    if (cached) waitT = setTimeout(function () { log('сеть не успела — сохранённая копия', cached.v); inject(cached, 'cache'); }, FAST);

    function attempt(n) {
      loadManifest().then(function (r) {
        var version = String(r.manifest.v || Math.floor(Date.now() / 60000));
        log('источник', r.base, 'версия', version);
        // та же или более старая версия (ответил только запасной источник) — сохранённая копия
        if (cached && vnum(cached.v) >= vnum(version)) { clearTimeout(waitT); inject(cached, 'cache'); return; }
        return download(version, r.base, r.manifest).then(function (c) {
          clearTimeout(waitT);
          // если сохранённая копия уже подключена — новая версия сохранена и включится при следующем открытии
          inject(c, 'network');
        });
      }).catch(function (e) {
        if (applied) return;
        if (cached) { clearTimeout(waitT); inject(cached, 'cache'); return; }
        // ни сети, ни копии: ждём сеть и пробуем снова (прелоадер пока держится)
        if (n < 6) {
          log('повтор', n + 1, e && e.message);
          var again = function () { window.removeEventListener('online', again); clearTimeout(t); attempt(n + 1); };
          var t = setTimeout(again, 3000);
          window.addEventListener('online', again);
          return;
        }
        failsafe(e);
      });
    }
    attempt(0);
  }
  start();
})();
</script>
