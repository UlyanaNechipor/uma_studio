<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Working Title</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--txt); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:300px; overflow:hidden; }
  .art { position:absolute; left:480px; top:0; width:480px; height:300px; }
  .art svg { display:block; width:480px; height:300px; overflow:hidden; }
  .acc { fill:var(--accent); }
  .base { fill:var(--fill-base); }
  .glow { fill:var(--figure-glow); }
  .ink { fill:var(--txt); }
  .blk { rx:var(--radius-btn); }
  .arc { fill:none; stroke:var(--bg); stroke-width:2; }
  .words { position:absolute; left:var(--margin-d); bottom:var(--margin-d); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.95; letter-spacing:-.04em; font-weight:300; color:var(--txt); }
  .name b { font-weight:700; }
  .tag { margin:var(--gutter-d) 0 0 4px; font-size:14px; line-height:20px; letter-spacing:.45px; color:var(--grey); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 300" width="480" height="300">
      <!--
        blocks      accent 232×280 bled off the top (the studio's one hue, largest) · fill-base 232×200 bled off the right (the unfilled-letter grey) · txt 96×56 (the ink) · figure-glow 96×40 bled off the bottom (the arc's rim) — ≈40% of 960×300
        arrangement one tall accent slab with satellites, gutter-d (16) between all, top and right edges bleeding like the hero figure
        pattern     arcs, from "the accent lives only in light and motion: the hero figure's glowing arc" — four quarter-arcs cut into the slab in bg, centred on its lower-right corner
        scales      sides in 8-multiples; gutters gutter-d (16); arc pitch 48 (3 × gutter-d); corners radius-btn (2)
      -->
      <defs><clipPath id="slab"><rect x="16" y="-20" width="232" height="280"/></clipPath></defs>
      <rect class="acc blk" x="16" y="-20" width="232" height="280" rx="2"/>
      <g clip-path="url(#slab)">
        <path class="arc" d="M248 212 A48 48 0 0 0 200 260"/>
        <path class="arc" d="M248 164 A96 96 0 0 0 152 260"/>
        <path class="arc" d="M248 116 A144 144 0 0 0 104 260"/>
        <path class="arc" d="M248 68 A192 192 0 0 0 56 260"/>
      </g>
      <rect class="ink blk" x="264" y="-8" width="96" height="56" rx="2"/>
      <rect class="base blk" x="264" y="64" width="232" height="196" rx="2"/>
      <rect class="glow blk" x="264" y="276" width="96" height="40" rx="2"/>
    </svg>
  </div>
  <div class="words">
    <p class="name"><b>WORKING</b><br>TITLE</p>
    <p class="tag">Дизайн-студия полного цикла. Санкт-Петербург.</p>
  </div>
</div>
</body>
</html>
